services:
  operations-console:
    build:
      context: ./operations-console
      dockerfile: Dockerfile
    image: confusedcrib/operations-console:latest
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  cat-gallery:
    build:
      context: ./cat-gallery
      dockerfile: Dockerfile
    image: confusedcrib/cat-gallery:latest
    ports:
      - "8081:8080"

  inventory-web:
    build:
      context: ./inventory-web
      dockerfile: Dockerfile
    image: confusedcrib/inventory-web:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development

  game-api:
    build:
      context: ./game-api
      dockerfile: Dockerfile
    image: confusedcrib/game-api:latest
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  diagnostics-runner:
    build:
      context: ./diagnostics-runner
      dockerfile: Dockerfile
    image: confusedcrib/diagnostics-runner:latest

networks:
  default:
    name: application-suite-network
    driver: bridge
