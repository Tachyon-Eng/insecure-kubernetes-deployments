name: Publish Docker images

on:
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker images to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image-data:
          - name: operations-console
            image: confusedcrib/operations-console
            context: ./operations-console
            dockerfile: ./operations-console/Dockerfile
          - name: cat-gallery
            image: confusedcrib/cat-gallery
            context: ./cat-gallery
            dockerfile: ./cat-gallery/Dockerfile
          - name: inventory-web
            image: confusedcrib/inventory-web
            context: ./inventory-web
            dockerfile: ./inventory-web/Dockerfile
          - name: diagnostics-runner
            image: confusedcrib/diagnostics-runner
            context: ./diagnostics-runner
            dockerfile: ./diagnostics-runner/Dockerfile
          - name: game-api
            image: confusedcrib/game-api
            context: ./game-api
            dockerfile: ./game-api/Dockerfile
          - name: code-review
            image: confusedcrib/code-review
            context: ./code-review
            dockerfile: ./code-review/Dockerfile

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ matrix.image-data.image }}
          tags: |
            type=raw,value=latest
            type=schedule,pattern=nightly
            type=semver,pattern={{version}}
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.image-data.context }}
          file: ${{ matrix.image-data.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
