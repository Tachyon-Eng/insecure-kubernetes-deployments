apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.operationsConsole.appName }}
  namespace: {{ .Values.operationsConsole.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.operationsConsole.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.operationsConsole.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.operationsConsole.appName }}
      annotations:
        kubescape.io/max-sniffing-time: "5m"
    spec:
      containers:
        - name: {{ .Values.operationsConsole.appName }}
          image: "{{ .Values.operationsConsole.image.repository }}:{{ .Values.operationsConsole.image.tag }}"
          env:
            - name: SCRIPT_NAME
              value: /app
            - name: AWS_ACCESS_KEY_ID
              value: AKIA2JAPX77RGLB664VE
            - name: AWS_SECRET_ACCESS_KEY
              value: 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
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
            - name: data
              mountPath: /data
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
        - name: data
          persistentVolumeClaim:
            claimName: operations-console-data
      serviceAccountName: operations-console-sa
---
apiVersion: v1
kind: Service
metadata:
  name: operations-console
  namespace: {{ .Values.operationsConsole.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: NodePort
  selector:
    app: operations-console
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: ssh
      port: 22
      targetPort: 22
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operations-console-role
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["pods", "serviceaccounts", "serviceaccounts/token"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operations-console-role-binding
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: operations-console-sa
    namespace: {{ .Values.operationsConsole.namespace }}
    apiGroup: ""
roleRef:
  kind: ClusterRole
  name: operations-console-role
  apiGroup: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operations-console-sa
  namespace: {{ .Values.operationsConsole.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: operations-console-ingress
  namespace: {{ .Values.operationsConsole.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /app/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: operations-console
                port:
                  number: 8080
