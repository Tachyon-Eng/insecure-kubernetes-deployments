apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.catGallery.namespace | default "cat-gallery" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.catGallery.service.name | default "cat-gallery" }}
  namespace: {{ .Values.catGallery.namespace | default "cat-gallery" }}
spec:
  selector:
    app: {{ .Values.catGallery.appName | default "cat-gallery" }}
  ports:
    - protocol: TCP
      port: {{ .Values.catGallery.service.port | default 8080 }}
      targetPort: {{ .Values.catGallery.service.targetPort | default 8080 }}
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.catGallery.appName }}
  namespace: {{ .Values.catGallery.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.catGallery.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.catGallery.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.catGallery.appName }}
    spec:
      containers:
        - name: {{ .Values.catGallery.containerName | default "cat-gallery" }}
          image: "{{ .Values.catGallery.image.repository }}:{{ .Values.catGallery.image.tag }}"
          env:
            - name: NODE_OPTIONS
              value: "--perf-basic-prof --interpreted-frames-native-stack"
          ports:
            - containerPort: {{ .Values.catGallery.containerPort | default 8080 }}
---
apiVersion: v1
kind: Service
metadata:
  name: cat-gallery-internal
  namespace: {{ .Values.catGallery.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: {{ .Values.catGallery.appName }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cat-gallery-ingress
  namespace: {{ .Values.catGallery.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /java/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: cat-gallery-internal
                port:
                  number: 8080
